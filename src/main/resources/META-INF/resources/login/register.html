<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 회원가입</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body { background-color: #0a0e17; color: #fff; font-family: 'Arial', sans-serif; }
        .navbar { background-color: #000; }
        .hero { background: linear-gradient(to bottom, #1e1e1e, #0a0e17); min-height: 60vh; }
        .btn-primary { background-color: #a020f0; border: none; }
        .btn-primary:hover { background-color: #800080; }
    </style>
</head>
<body>

    <!-- 네비바 → login.html과 동일하게 재활용 -->
    <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
          <button class="btn border-0" id="themeToggleBtn">🌙 DARK</button>
          <img src="../image/logo1.jpeg" alt="로고" width="40" height="36" />
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">뉴스</a></li>
            <li class="nav-item"><a class="nav-link" href="#">챔피언</a></li>
            <li class="nav-item"><a class="nav-link" href="main_page_sub/download.html">다운로드</a></li>
            <li class="nav-item"><a class="nav-link" href="/login">로그인</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 회원가입 폼 (login.html 디자인 재활용) -->
    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 480px;">
            <h2 class="fw-bold mb-4">회원가입</h2>
            <form id="registerForm" action="/register_check" method="post">
                <!-- 아이디 -->
                <div class="mb-3 text-start">
                    <label class="form-label">아이디 *</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="4~20자 영문/숫자" required>
                    <div class="invalid-feedback" id="usernameMsg"></div>
                </div>
                <!-- 패스워드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 *</label>
                    <input type="password" class="form-control" id="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
                    <div class="invalid-feedback" id="passwordMsg"></div>
                </div>
                <!-- 패스워드 확인 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 확인 *</label>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="패스워드 재입력" required>
                    <div class="invalid-feedback" id="passwordConfirmMsg"></div>
                </div>
                <!-- 이메일 -->
                <div class="mb-3 text-start">
                    <label class="form-label">이메일 *</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
                    <div class="invalid-feedback" id="emailMsg"></div>
                </div>
                <!-- 연락처 -->
                <div class="mb-3 text-start">
                    <label class="form-label">연락처 *</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="010-0000-0000" required>
                    <div class="invalid-feedback" id="phoneMsg"></div>
                </div>
                <!-- 해시된 패스워드(화면에 안 보임) → 서버로 SHA-256 해시값 전송 -->
                <input type="hidden" id="hashedPassword" name="password">
                <button type="button" class="btn btn-primary w-100" onclick="validateAndShowModal()">회원가입</button>
            </form>
        </div>
    </section>

    <!-- 가입 확인 모달 (입력 정보 확인 후 해시값 전송) -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">가입 확인</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>아래 정보로 가입하시겠습니까?</p>
                    <table class="table table-dark table-bordered">
                        <tr><th>아이디</th><td id="confirmUsername"></td></tr>
                        <tr><th>이메일</th><td id="confirmEmail"></td></tr>
                        <tr><th>연락처</th><td id="confirmPhone"></td></tr>
                        <tr><th>패스워드</th><td>******** (암호화 전송)</td></tr>
                    </table>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="submitRegister()">가입하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 (최하단 연동) -->
    <script src="../js/input_check.js"></script>
    <script src="../js/input_sha256.js"></script>
    <script src="../js/toggle.js"></script>
</body>
</html>
